spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 10000
      idle-timeout: 120000
      maximum-pool-size: 20
      minimum-idle: 1
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 10000ms
  jpa:
    properties:
      show-sql: false

logging:
  level:
    org:
      hibernate:
        SQL: WARN